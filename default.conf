[ids]
*

# Physical Alt (next to spacebar, where Mac's Cmd key sits) becomes the
# Command key. Tapping it alone still just sends plain alt (harmless no-op,
# and also what GNOME's overlay-key is repointed at -- see install.sh).
# The old Super/Win key now sends plain alt, so anything that depended on
# Alt (Alt+Tab, Alt+F4, menu mnemonics) keeps working from that key too.
[main]
leftalt = overload(cmd, leftalt)
leftmeta = leftalt
rightmeta = leftalt

# ":A" makes any key NOT explicitly listed below fall back to Alt+<key>,
# which is what keeps Alt+Tab / Alt+F4 / GTK mnemonics working through
# this layer. Omitting it (as upstream keyd's own macos.conf example does
# with a plain "[meta_mac:C]"/unqualified layer) silently drops those.
[cmd:A]
a = C-a
b = C-b
c = C-c
d = C-d
e = C-e
f = C-f
g = C-g
h = C-h
i = C-i
j = C-j
k = C-k
l = C-l
m = C-m
n = C-n
o = C-o
p = C-p
q = C-q
r = C-r
s = C-s
t = C-t
u = C-u
v = C-v
w = C-w
x = C-x
y = C-y
z = C-z
0 = C-0
1 = C-1
2 = C-2
3 = C-3
4 = C-4
5 = C-5
6 = C-6
7 = C-7
8 = C-8
9 = C-9
comma = C-comma
dot = C-dot
minus = C-minus
equal = C-equal
leftbrace = C-leftbrace
rightbrace = C-rightbrace
backslash = C-backslash
semicolon = C-semicolon
apostrophe = C-apostrophe
slash = C-slash
grave = C-grave
backspace = C-backspace
